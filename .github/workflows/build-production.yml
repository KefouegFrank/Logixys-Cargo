# The server's Node can't run Vite 8, so assets are built here and committed to
# `production`, which is the branch cPanel checks out. main stays source-only.
name: Build production branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Commit the build on top of production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/build
          tree=$(git write-tree)

          # Parent on the previous production tip so cPanel's pull is always a fast-forward.
          parents="-p $GITHUB_SHA"
          if git fetch --quiet origin production; then
            parents="-p FETCH_HEAD $parents"
          fi

          commit=$(git commit-tree "$tree" $parents -m "build ${GITHUB_SHA::7}")
          git push origin "$commit:refs/heads/production"

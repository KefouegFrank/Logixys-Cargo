; Supervisor alternative to the systemd unit — use one or the other, not both.
;   sudo cp deploy/logixys-worker.supervisor.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
[program:logixys-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/logixys-cargo/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/logixys-cargo/storage/logs/worker.log
stopwaitsecs=3600
